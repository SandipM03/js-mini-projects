<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#128591; Welcome to  QR Code Generator</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QR Code Generator</h1>
            <p>Transform your text or URL into a QR code instantly</p>
        </div>
        
        <div class="input-group">
            <label for="qrText">Enter your text or URL</label>
            <input type="text" placeholder="Type or paste your content here" id="qrText">
        </div>

        <div class="imgBox" id="imgBox">
            <img src="" id="qrImage" alt="QR Code">
        </div>

        <button onclick="generateQR()">
            <span>Generate QR Code</span>
        </button>
    </div>

    <script src="dash.js"></script>
</body>
</html>
